name: Project Knowledge Integrity
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/knowledge.py validate --strict
      - run: python scripts/knowledge.py links
      - run: python -m unittest discover -s scripts -p 'test_knowledge.py'
      - name: Report knowledge review candidates
        if: github.event_name == 'pull_request'
        env:
          KNOWLEDGE_BASE: ${{ github.event.pull_request.base.sha }}
        run: python scripts/knowledge.py sync-check --base "$KNOWLEDGE_BASE"
